<html lang="en">
<head>
<meta charset="utf-8">
<title>D.E.N.N.I.S.</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #orb { position: fixed; inset: 0; cursor: grab; }

  <div id="orb" title="D.E.N.N.I.S. - drag to move, click to open, right-click for options"></div>
